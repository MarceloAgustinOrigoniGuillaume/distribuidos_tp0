name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    environment:
      - PYTHONUNBUFFERED=1
      - AGENCY_COUNT={CLIENT_COUNT}
    networks:
      - testing_net
    volumes:
      - {SERVER_CONFIG_FILE}:/usr/config.ini

$CLIENTS

networks:
  testing_net:
    ipam:
      driver: default
      config:
        - subnet: 172.25.125.0/24
